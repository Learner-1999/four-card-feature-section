<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>training</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }

      .box {
        display: grid;
        grid-template-columns: repeat(3, 200px);
        grid-template-rows: repeat(3, 200px);
        /* row-gap: 20px; */
      }

      .container {
        width: 50px;
        height: 50px;
        background-color: red;
      }

      .container1 {
        align-self: center;
        justify-self: start;
        grid-column: -3;
        grid-row: 1;
      }

      .container2 {
        grid-column: -3;
        grid-row: 1;
        align-self: end;
        justify-self: center;
        margin-bottom: 36px;
      }

      .container3 {
        align-self: center;
        justify-self: end;
        grid-column: -3;
        grid-row: 1;
      }

      .container4 {
        grid-column: -3;
        grid-row: 1;
        justify-self: center;
        margin-top: 36px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="container container1">1</div>
      <div class="container container2">2</div>
      <div class="container container3">3</div>
      <div class="container container4">4</div>
    </div>
  </body>
</html>
