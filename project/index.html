<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>training</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }

      body {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .box {
        position: relative;
        background-color: black;
        width: 200px;
      }

      .container {
        position: absolute;
        /* margin: 20px; */
        width: 50px;
        height: 50px;
        background-color: red;
      }

      .container1 {
        left: 164px;
      }

      .container2 {
        top: -24px;
        left: 77px;
      }

      .container3 {
        top: 42px;
        left: 77px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="container container1">1</div>
      <div class="container container2">2</div>
      <div class="container container3">3</div>
      <div class="container container4">4</div>
    </div>
  </body>
</html>
